name: Engineer dashboard regression

on:
  pull_request:
    branches: [local-dev]
    paths:
      - 'src/lib/dashboard-*'
      - 'src/lib/customer-call-history-metrics.ts'
      - 'src/lib/engineer-dashboard-metrics.test.ts'
      - 'src/lib/calls-incoming-placeholder*'
      - 'src/lib/use-home-live-incoming-calls.ts'
      - 'src/lib/load-customer-knowledge-sources.ts'
      - 'src/components/dashboard-live-refresh.tsx'
      - 'src/app/(dashboard)/dashboard/**'
      - 'scripts/check-dashboard-metrics-regression.mjs'
      - 'scripts/fixtures/engineer-dashboard.sql'
      - '.github/workflows/engineer-metrics.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Engineer dashboard focused tests
        run: npx tsx --test --test-reporter=spec src/lib/engineer-dashboard-metrics.test.ts src/lib/dashboard-customer-events.test.ts src/lib/dashboard-activity-feed.test.ts
      - name: Start disposable PostgREST fixture
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < scripts/fixtures/engineer-dashboard.sql
          docker run --rm -d --name engineer-metrics-rest --network host \
            -e PGRST_DB_URI=postgres://postgres:fixture-password@127.0.0.1:5432/postgres \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=metrics_reader \
            -e PGRST_SERVER_PORT=54321 postgrest/postgrest:v13.0.4
          for attempt in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:54321/call_logs?select=id&limit=0'; then exit 0; fi
            sleep 1
          done
          docker logs engineer-metrics-rest
          exit 1
      - name: PostgREST query and tenant-isolation tests
        env:
          ENGINEER_METRICS_REST_URL: http://127.0.0.1:54321
        run: npx tsx --test --test-reporter=spec src/lib/dashboard-customer-data.integration.test.ts
      - name: Compare full tests and types against local-dev
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-dashboard-metrics-regression.mjs
